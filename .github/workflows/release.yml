name: Publish to npm (with provenance)

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify
        run: |
          bun run typecheck
          bun run lint
          bunx jest --ci
          bunx bob build

      # Trusted Publishing: npm exchanges this job's OIDC token for a
      # short-lived publish token itself, once the package's npm settings
      # name this repo + workflow as a trusted publisher. No npm secret
      # to store or rotate. Needs a CLI that supports it.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish
        run: npm publish --access public
